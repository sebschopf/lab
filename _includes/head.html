<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">

    <title>{{ page.title }} | Lab OKLCH</title>
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    
    <meta name="description" content="{{ page.subtitle }}">
    <meta name="robots" content="index, follow, max-snippet:-1">
    
    <meta name="theme-color" content="#ff3399">
    <meta name="theme-color" content="oklch(0.85 0.35 330)">

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

    <meta property="og:site_name" content="Lab OKLCH">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.subtitle }}">
    <meta property="og:type" content="website">

    <!-- Auto-load page specific CSS if exists (convention over configuration) -->
    {% capture page_css %}{{ page.name | replace: '.html', '.css' }}{% endcapture %}
    {% assign css_exists = site.static_files | where: "path", page_css | first %}
    {% if css_exists %}
    <link rel="stylesheet" href="{{ page_css | relative_url }}">
    {% endif %}
</head>
